services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oria_dev}
      POSTGRES_DB: oria
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oria -d oria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embeddings:
    # cpu-1.5 tem um bug conhecido no download dos artefatos do modelo
    # ("relative URL without a base" ao lidar com um 404 esperado de um dos
    # arquivos de config). cpu-1.8 corrige isso.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command:
      - --model-id=intfloat/multilingual-e5-base
      - --port=80
      - --max-client-batch-size=64
      - --auto-truncate
    ports:
      - "8080:80"
    volumes:
      - hfcache:/data
    environment:
      HF_HOME: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://oria:${POSTGRES_PASSWORD:-oria_dev}@db:5432/oria
      REDIS_URL: redis://redis:6379
      EMBEDDINGS_URL: http://embeddings:80
      EMBEDDINGS_DIM: "768"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_DIALOGUE_MODEL: ${LLM_DIALOGUE_MODEL}
      LLM_HINT_MODEL: ${LLM_HINT_MODEL}
      LLM_FICHAMENTO_MODEL: ${LLM_FICHAMENTO_MODEL}
      LLM_PANORAMA_MODEL: ${LLM_PANORAMA_MODEL}
      LLM_QUESTIONS_MODEL: ${LLM_QUESTIONS_MODEL}
      LLM_CONCEPTS_MODEL: ${LLM_CONCEPTS_MODEL}
      ATTEMPT_MAX_STEPS: "3"
      METACOG_CONFIANCA_MIN: "70"
      METACOG_PASSOS_MIN: "2.5"
      RETRIEVAL_LIMIAR: "0.72"
      RETRIEVAL_TOP_K: "6"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      VALIDACAO_MODELO: ${VALIDACAO_MODELO}
      VALIDACAO_PROVIDER: ${VALIDACAO_PROVIDER}
      VALIDACAO_SEED: "42"
    ports:
      - "3000:3000"
    volumes:
      - ./acervo:/app/acervo:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  hfcache:
